<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="/manifest.json">
<title>camhdmi</title>
<style>
:root{--bg:#111;--card:#1c1c1c;--line:#2a2a2a;--txt:#eee;--dim:#999;--acc:#2f7ae5;--live:#1fbf5a;--frz:#e5383b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 12px 40px;user-select:none;-webkit-user-select:none}
header{display:flex;align-items:center;gap:10px;padding:10px 0}
#tally{font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--live);color:#fff;letter-spacing:.5px}
#tally.frozen{background:var(--frz)}
#tally.off{background:#555}
#cam{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mode{color:var(--dim);font-size:12px}
#pv{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9}
#pv img{width:100%;height:100%;object-fit:contain;display:block}
#pvmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}
#toast{min-height:22px;color:#8ab4f8;font-size:13px;text-align:center;padding:4px 0}
button{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;min-height:52px;touch-action:manipulation}
button:active{background:#2a2a2a}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#freeze{width:100%;min-height:58px;font-weight:700;font-size:17px;letter-spacing:.5px;margin-bottom:10px}
#freeze.on{background:var(--frz);border-color:var(--frz)}
.row{display:grid;gap:8px;margin-bottom:10px}
.view{grid-template-columns:auto 1fr}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,52px);gap:5px}
.pad button{font-size:20px}
.side{display:grid;gap:8px;align-content:start}
.zoom{display:grid;grid-template-columns:56px 1fr 56px;gap:6px;align-items:center}
.zoom button{font-size:24px}
#zl{text-align:center;font-size:13px;color:var(--dim)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.presets{grid-template-columns:repeat(6,1fr);gap:6px}
.presets button{min-height:46px;font-weight:700}
.presets button.set{border-color:var(--acc);color:#8ab4f8}
.hint{color:var(--dim);font-size:12px;text-align:center;margin:-4px 0 12px}
h2{font-size:13px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin:18px 0 6px}
.ctl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.ctl.dis{opacity:.4}
.ctl .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ctl .val{color:#8ab4f8;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:10px 0 2px;height:28px;accent-color:var(--acc)}
select{font:inherit;color:var(--txt);background:#111;border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;margin-top:8px}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#444;border-radius:99px;transition:.15s}
.sw span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:before{transform:translateX(22px)}
#reset{width:100%;margin-top:10px;color:#f28b82}
#conn{position:fixed;bottom:0;left:0;right:0;background:var(--frz);color:#fff;text-align:center;padding:6px;font-size:13px;display:none}
</style>
</head>
<body>
<header><span id="tally" class="off">—</span><span id="cam">camhdmi</span><span id="mode"></span></header>
<div id="pv"><img id="img" alt=""><div id="pvmsg">Connecting…</div></div>
<div id="toast"></div>
<button id="freeze">FREEZE</button>
<div class="row view">
  <div class="pad">
    <span></span><button data-hold="pan" data-dx="0" data-dy="-1" aria-label="Tilt up">▲</button><span></span>
    <button data-hold="pan" data-dx="-1" data-dy="0" aria-label="Pan left">◀</button><button id="center" aria-label="Reset view">⌂</button><button data-hold="pan" data-dx="1" data-dy="0" aria-label="Pan right">▶</button>
    <span></span><button data-hold="pan" data-dx="0" data-dy="1" aria-label="Tilt down">▼</button><span></span>
  </div>
  <div class="side">
    <div class="zoom"><button data-hold="zoom" data-d="-1" aria-label="Zoom out">−</button><div id="zl">Zoom</div><button data-hold="zoom" data-d="1" aria-label="Zoom in">+</button></div>
    <div class="two"><button id="mirror">Mirror</button><button id="flip">Flip</button></div>
  </div>
</div>
<div class="row presets" id="presets"></div>
<div class="hint">tap preset = recall · hold = save</div>
<h2>Image</h2>
<div id="ctls"></div>
<button id="reset">Reset camera to defaults</button>
<div id="conn">Reconnecting to camhdmi…</div>
<script>
const $ = s => document.querySelector(s);
let S = {}, busy = {}, toastT = 0;

function act(o){ return fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).catch(()=>{}); }
function toast(t){ $('#toast').textContent = t||''; clearTimeout(toastT); if(t) toastT=setTimeout(()=>$('#toast').textContent='',2500); }

/* hold-to-repeat for pan / zoom */
document.querySelectorAll('[data-hold]').forEach(b=>{
  let iv=0, to=0;
  const send=()=>{ const d=b.dataset; act(d.hold==='pan'?{a:'pan',dx:+d.dx,dy:+d.dy}:{a:'zoom',d:+d.d}); };
  const stop=()=>{ clearTimeout(to); clearInterval(iv); iv=to=0; };
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); send(); to=setTimeout(()=>iv=setInterval(send,140),380); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
});
$('#center').onclick=()=>act({a:'center'});
$('#mirror').onclick=()=>act({a:'mirror'});
$('#flip').onclick=()=>act({a:'flip'});
$('#freeze').onclick=()=>act({a:'freeze'});
$('#reset').onclick=()=>{ if(confirm('Reset all camera settings to defaults?')) act({a:'reset'}); };

/* presets: tap recall, hold save */
for(let n=1;n<=6;n++){
  const b=document.createElement('button'); b.textContent=n; let t=0, saved=false;
  b.addEventListener('pointerdown',()=>{ saved=false; t=setTimeout(()=>{ saved=true; act({a:'preset',n,save:true}); if(navigator.vibrate) navigator.vibrate(40); },700); });
  b.addEventListener('pointerup',()=>{ clearTimeout(t); if(!saved) act({a:'preset',n,save:false}); });
  ['pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(t)));
  $('#presets').appendChild(b);
}

/* controls built from whatever the camera reports */
let built='';
function buildControls(){
  const box=$('#ctls'); box.innerHTML='';
  (S.controls||[]).forEach(c=>{
    const d=document.createElement('div'); d.className='ctl'; d.id='c_'+c.name;
    if(c.kind==='bool'){
      d.innerHTML=`<div class="top"><span>${c.label}</span><label class="sw"><input type="checkbox"><span></span></label></div>`;
      d.querySelector('input').onchange=e=>act({a:'set',name:c.name,value:e.target.checked?1:0});
    } else if(c.kind==='menu'||c.kind==='intmenu'){
      const opts=Object.entries(c.menu).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
      d.innerHTML=`<div class="top"><span>${c.label}</span></div><select>${opts}</select>`;
      d.querySelector('select').onchange=e=>act({a:'set',name:c.name,value:+e.target.value});
    } else {
      d.innerHTML=`<div class="top"><span>${c.label}</span><span class="val"></span></div><input type="range" min="${c.min}" max="${c.max}" step="${c.step}">`;
      const r=d.querySelector('input'), v=d.querySelector('.val'); let tm=0;
      r.addEventListener('input',()=>{ busy[c.name]=Date.now(); v.textContent=r.value; if(!tm) tm=setTimeout(()=>{ tm=0; act({a:'set',name:c.name,value:+r.value}); },80); });
      r.addEventListener('change',()=>{ busy[c.name]=Date.now(); act({a:'set',name:c.name,value:+r.value}); });
    }
    box.appendChild(d);
  });
}
function render(){
  const t=$('#tally');
  if(!S.camera){ t.className='off'; t.textContent='NO CAMERA'; $('#cam').textContent='No camera'; $('#mode').textContent=''; $('#pvmsg').textContent='Plug in a USB camera'; $('#pvmsg').style.display='flex'; }
  else { t.className=S.frozen?'frozen':''; t.textContent=S.frozen?'FROZEN':'LIVE'; $('#cam').textContent=S.camera; $('#mode').textContent=S.mode; }
  $('#freeze').classList.toggle('on',!!S.frozen); $('#freeze').textContent=S.frozen?'FROZEN — tap to go live':'FREEZE';
  $('#mirror').classList.toggle('on',!!S.mirror); $('#flip').classList.toggle('on',!!S.flip);
  $('#zl').textContent=S.zoom||'Zoom';
  document.querySelectorAll('#presets button').forEach((b,i)=>b.classList.toggle('set',(S.presets||[]).includes(String(i+1))));
  const sig=(S.controls||[]).map(c=>c.name).join(',');
  if(sig!==built){ built=sig; buildControls(); }
  (S.controls||[]).forEach(c=>{
    const d=document.getElementById('c_'+c.name); if(!d) return;
    d.classList.toggle('dis',!!c.inactive);
    d.querySelectorAll('input,select').forEach(e=>e.disabled=!!c.inactive);
    if(c.kind==='bool') d.querySelector('input').checked=!!c.value;
    else if(c.kind==='menu'||c.kind==='intmenu') d.querySelector('select').value=String(c.value);
    else if(!(busy[c.name] && Date.now()-busy[c.name]<1500)){ d.querySelector('input').value=c.value; d.querySelector('.val').textContent=c.value; }
  });
  if(S.msg) toast(S.msg);
}

/* live state */
function connect(){
  const es=new EventSource('/events');
  es.onmessage=e=>{ $('#conn').style.display='none'; try{ S=JSON.parse(e.data); render(); }catch(_){} };
  es.onerror=()=>{ $('#conn').style.display='block'; es.close(); setTimeout(connect,2000); };
}
fetch('/api/state').then(r=>r.json()).then(s=>{ S=s; render(); }).catch(()=>{});
connect();

/* preview: reconnect if the stream drops */
const img=$('#img');
function startPreview(){ img.src='/stream.mjpg?'+Date.now(); }
img.onload=()=>{ $('#pvmsg').style.display='none'; };
img.onerror=()=>{ $('#pvmsg').textContent='Preview reconnecting…'; $('#pvmsg').style.display='flex'; setTimeout(startPreview,2000); };
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') startPreview(); });
startPreview();
</script>
</body>
</html>
